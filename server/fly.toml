# Choose your own Fly app name before deploying.
app = "your-codefolio-service"
primary_region = "lhr"
[build]
  dockerfile = "Dockerfile"
[env]
  HOST = "0.0.0.0"
  PORT = "1234"
  CODEFOLIO_DATA_DIR = "/data"
[http_service]
  internal_port = 1234
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    path = "/health"
[[mounts]]
  source = "codefolio_data"
  destination = "/data"
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
